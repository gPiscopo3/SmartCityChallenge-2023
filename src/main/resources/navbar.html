<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<style>

  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
  }

  .navbar {
    overflow: hidden;
    background-color: #61cb34;
    font-family: Arial, Helvetica, sans-serif;
  }

  .navbar a {

    float: left;
    font-size: 16px;
    color: black;
    text-align: center;
    padding: 14px 16px;
    text-decoration: none;
  }

  .dropdown {
    float: left;
    overflow: hidden;
  }

  .dropdown .dropbtn {
    font-size: 16px;
    border: none;
    outline: none;
    color: black;
    padding: 14px 16px;
    background-color: inherit;
    font: inherit;
    margin: 30px;
  }

  .navbar a:hover, .dropdown:hover .dropbtn {
    background-color: rgb(213,240,213);
  }

  .dropdown-content {
    display: none;
    position: absolute;
    background-color: rgb(213,240,213);
    width: 100%;
    left: 0;
    box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
    z-index: 1;
  }

  .dropdown:hover .dropdown-content {
    display: block;
  }

  /* Create three equal columns that floats next to each other */
  .column1 {
    float: left;
    width: 33.33%;
    padding: 10px;
    height: 120px;
  }

  .column1 a {
    float: none;
    color: black;
    padding: 16px;
    text-decoration: none;
    display: block;
    text-align: left;
  }

  .column1 a:hover {
    background-color: #61cb34;
  }
  *{
    box-sizing: border-box;
  }

</style>
<body>
<div class="navbar">

  <div class="dropdown">
    <button class="dropbtn"><b>Menu</b></button>
    <div class="dropdown-content">

      <div class="row1">
        <div class="column1">

          <a href="Sc.html">Scheduling</a>
          <a href="forecasting.html">Forecasting</a>
        </div>

      </div>
    </div>
  </div>


  <img src = "logo.png" height = "100" width = "400"  style="margin-left: 60%">
</div>

</body>
</html>
